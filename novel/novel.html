<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godthrone Gehenna - Story Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="vnViewport">
        <!-- Dual Sprite Overlay Layer -->
        <div class="characterLayer">
            <img id="ziziusSprite" class="spriteElement" src="" alt="">
            <img id="asmodeusSprite" class="spriteElement" src="" alt="">
        </div>
        
        <!-- Interactive Cinematic Dialogue Setup -->
        <div class="dialogueContainer">
            <div id="speakerName" class="speakerLabel"></div>
            <div id="interactiveBox" class="dialogueWindow">
                <p id="sceneText"></p>
                <div class="actionPrompt">Click window to advance</div>
            </div>
        </div>
    </div>

    <script src="storydata.js"></script>
    <script src="novelengine.js"></script>
</body>
</html>
